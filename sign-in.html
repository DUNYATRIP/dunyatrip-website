<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | DunyaTrip</title><style>
:root{--g:#00A86B;--bright:#19C982;--light:#DDF8EA;--bg:#F5FAF7;--dark:#18352B;--muted:#64748B;--border:#E5EEE8}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--dark);font:15px Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.top{height:72px;padding:0 5%;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo{font-size:27px;font-weight:900}.logo span{color:var(--g)}.layout{min-height:calc(100vh - 72px);display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px;text-align:center}.brand .mark{font-size:clamp(38px,5vw,58px);font-weight:900;letter-spacing:-2px}.brand .mark span{color:var(--g)}.plane{font-size:54px;color:var(--g)}.brand h2{margin:0;font-size:25px}.partner{margin-top:22px;border:1px solid var(--g);color:var(--g);border-radius:10px;padding:12px 24px;font-weight:800}.form-side{display:flex;align-items:center;justify-content:center;padding:35px 22px}.form{width:min(410px,100%)}h1{font-size:34px;margin:0 0 7px}.muted{color:var(--muted);margin:0 0 25px}.switch{display:grid;grid-template-columns:1fr 1fr;background:#f1f6f3;padding:4px;border-radius:10px;margin-bottom:19px}.switch button{border:0;background:transparent;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--dark)}.switch button.active{background:#fff;color:var(--g);box-shadow:0 1px 5px #18352b12}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;border:1px solid var(--border);border-radius:9px;padding:14px;font:inherit;outline-color:var(--g)}.forgot{text-align:right;margin:10px 0 18px;color:var(--g);font-size:13px;font-weight:700}.submit{width:100%;border:0;border-radius:9px;background:var(--g);color:#fff;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.signup{text-align:center;margin-top:20px;color:var(--muted);font-size:14px}.signup a{color:var(--g);font-weight:800}.status{font-size:13px;color:#b42318;margin-top:12px;min-height:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.brand{padding:30px 20px;gap:10px}.brand .mark{font-size:38px}.plane{font-size:36px}.brand h2{font-size:20px}.partner{margin-top:5px}.form-side{padding:35px 22px}.layout{min-height:auto}}
</style></head><body><header class="top"><a class="logo" href="index.html">Dunya<span>Trip</span>.</a></header><main class="layout"><aside class="brand"><div class="mark">Dunya<span>Trip</span>.</div><div class="plane">✈</div><h2>Explore the World</h2><a class="partner" href="partner.html">Become a Partner</a></aside><section class="form-side"><form class="form" id="login"><h1>Sign In</h1><p class="muted">Welcome back! Please sign in to continue.</p><div class="switch"><button type="button" class="active" id="emailTab">Email</button><button type="button" id="phoneTab">Phone</button></div><label id="identityLabel" for="identity">Email Address</label><input id="identity" type="email" placeholder="Enter your email address" autocomplete="username"><label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password"><div class="forgot"><a href="#" id="forgot">Forgot Password?</a></div><button class="submit" id="submit" type="submit">Sign In</button><div class="status" id="status" role="status" aria-live="polite"></div><div class="signup">Don't have an account? <a href="#" id="create">Create Account</a></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const cfg=window.DUNYATRIP_SUPABASE_CONFIG||{};const client=window.supabase&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;let mode="email";const tab=(m)=>{mode=m;document.getElementById("emailTab").classList.toggle("active",m==="email");document.getElementById("phoneTab").classList.toggle("active",m==="phone");const i=document.getElementById("identity");i.type=m==="email"?"email":"tel";i.placeholder=m==="email"?"Enter your email address":"+92 3XX XXXXXXX";document.getElementById("identityLabel").textContent=m==="email"?"Email Address":"Phone Number";};document.getElementById("emailTab").onclick=()=>tab("email");document.getElementById("phoneTab").onclick=()=>tab("phone");
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const status=document.getElementById("status"),btn=document.getElementById("submit"),identity=document.getElementById("identity").value.trim(),password=document.getElementById("password").value;if(!client){status.textContent="Sign in is not connected yet.";return;}if(!identity||!password){status.textContent="Enter your login details.";return;}btn.disabled=true;btn.textContent="Signing in…";status.textContent="";try{const credentials=mode==="email"?{email:identity,password}:{phone:identity,password};const {error}=await client.auth.signInWithPassword(credentials);if(error)throw error;status.style.color="#008653";status.textContent="Signed in successfully.";setTimeout(()=>location.href="index.html",500);}catch(err){status.textContent=err.message||"Unable to sign in.";}finally{btn.disabled=false;btn.textContent="Sign In";}});
document.getElementById("forgot").onclick=async e=>{e.preventDefault();const email=document.getElementById("identity").value.trim(),status=document.getElementById("status");if(mode!=="email"||!email){status.textContent="Enter your email address first.";return;}if(!client){status.textContent="Password reset is not connected.";return;}const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/sign-in.html"});status.textContent=error?error.message:"If this email has an account, a password reset link will be sent.";};
document.getElementById("create").onclick=e=>{e.preventDefault();document.getElementById("status").textContent="Account creation is handled by DunyaTrip. Please contact our team.";};
</script></body></html>
