<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | DunyaTrip</title><style>
:root{--g:#00A86B;--bright:#19C982;--light:#DDF8EA;--bg:#F5FAF7;--dark:#18352B;--muted:#64748B;--border:#E5EEE8}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--dark);font:15px Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.top{height:72px;padding:0 5%;display:flex;align-items:center;border-bottom:1px solid var(--border)}.logo{font-size:27px;font-weight:900}.logo span{color:var(--g)}.layout{min-height:calc(100vh - 72px);display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px;text-align:center}.brand .mark{font-size:clamp(38px,5vw,58px);font-weight:900;letter-spacing:-2px}.brand .mark span{color:var(--g)}.plane{font-size:54px;color:var(--g)}.brand h2{margin:0;font-size:25px}.partner{margin-top:22px;border:1px solid var(--g);color:var(--g);border-radius:10px;padding:12px 24px;font-weight:800}.form-side{display:flex;align-items:center;justify-content:center;padding:35px 22px}.form{width:min(410px,100%)}h1{font-size:34px;margin:0 0 7px}.muted{color:var(--muted);margin:0 0 25px}.switch{display:grid;grid-template-columns:1fr 1fr;background:#f1f6f3;padding:4px;border-radius:10px;margin-bottom:19px}.switch button{border:0;background:transparent;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--dark)}.switch button.active{background:#fff;color:var(--g);box-shadow:0 1px 5px #18352b12}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;border:1px solid var(--border);border-radius:9px;padding:14px;font:inherit;outline-color:var(--g)}.forgot{text-align:right;margin:10px 0 18px;color:var(--g);font-size:13px;font-weight:700}.social{display:grid;grid-template-columns:1fr;gap:12px;margin:26px 0}.social button{border:1px solid var(--border);background:#fff;color:var(--dark);border-radius:9px;padding:15px 12px;font-weight:700;cursor:pointer;font-size:15px}.social button:disabled{opacity:.6;cursor:wait}.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:15px 0}.or:before,.or:after{content:"";height:1px;background:var(--border);flex:1}.submit{width:100%;border:0;border-radius:9px;background:var(--g);color:#fff;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.signup{text-align:center;margin-top:20px;color:var(--muted);font-size:14px}.signup a{color:var(--g);font-weight:800}.status{font-size:13px;color:#b42318;margin-top:12px;min-height:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.brand{padding:30px 20px;gap:10px}.brand .mark{font-size:38px}.plane{font-size:36px}.brand h2{font-size:20px}.partner{margin-top:5px}.form-side{padding:35px 22px}.layout{min-height:auto}}
</style></head><body><header class="top"><a class="logo" href="index.html">Dunya<span>Trip</span>.</a></header><main class="layout"><aside class="brand"><div class="mark">Dunya<span>Trip</span>.</div><div class="plane">✈</div><h2>Explore the World</h2><a class="partner" href="partner.html">Become a Partner</a></aside><section class="form-side"><div class="form"><h1>Welcome to DunyaTrip</h1><p class="muted">Continue securely with your social account.</p><div class="social"><button type="button" id="googleLogin"><span aria-hidden="true">G</span> Continue with Google</button><button type="button" id="facebookLogin"><span aria-hidden="true">f</span> Continue with Facebook</button></div><div class="status" id="status" role="status" aria-live="polite"></div><p class="muted" style="font-size:12px;margin-top:20px">New here? Your DunyaTrip account will be created automatically when you continue.</p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const cfg=window.DUNYATRIP_SUPABASE_CONFIG||{};
const client=window.supabase&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
async function socialLogin(provider){
 const status=document.getElementById("status");
 const buttons=[document.getElementById("googleLogin"),document.getElementById("facebookLogin")];
 if(!client){status.textContent="Sign in is not connected yet.";return;}
 buttons.forEach(b=>b.disabled=true);
 status.textContent="Connecting to "+(provider==="google"?"Google":"Facebook")+"…";
 try{
  const {error}=await client.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+"/index.html",queryParams:provider==="google"?{prompt:"select_account"}:undefined}});
  if(error)throw error;
 }catch(err){status.textContent=err.message||"Social sign-in could not start.";buttons.forEach(b=>b.disabled=false);}
}
document.getElementById("googleLogin").onclick=()=>socialLogin("google");
document.getElementById("facebookLogin").onclick=()=>socialLogin("facebook");
</script></body></html>
