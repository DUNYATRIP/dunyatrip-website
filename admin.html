
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DunyaTrip | Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }
    header {
      background: #092b52;
      color: white;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h2 { margin: 0; }
    .container {
      max-width: 1150px;
      margin: 30px auto;
      padding: 0 18px;
    }
    .panel, .stat {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 3px 15px #14213d0d;
    }
    .login-box {
      max-width: 420px;
      margin: 60px auto;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d5dce7;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      background: #0877c9;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #065fa2; }
    .logout { width: auto; background: #e44b4b; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 22px;
    }
    .stat h3 { margin: 0 0 10px; color: #667085; }
    .stat strong { font-size: 28px; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }
    th, td {
      text-align: left;
      padding: 13px;
      border-bottom: 1px solid #e8edf3;
      vertical-align: top;
    }
    th { background: #f7f9fc; }
    td select { min-width: 130px; }
    .hidden { display: none; }
    #message { color: #c0392b; }
    .muted { color: #667085; }
    @media(max-width: 650px) {
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h2>✈ DunyaTrip Admin</h2>
  <button id="logoutBtn" class="logout hidden">Logout</button>
</header>

<div class="container">

  <section id="loginSection" class="panel login-box">
    <h2>Admin Login</h2>
    <p class="muted">Login to manage customer enquiries.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="message"></p>
  </section>

  <section id="dashboard" class="hidden">
    <h2>Dashboard</h2>
    <p class="muted">Welcome to your DunyaTrip enquiry management panel.</p>

    <div class="stats">
      <div class="stat">
        <h3>New Enquiries</h3>
        <strong id="newCount">0</strong>
      </div>
      <div class="stat">
        <h3>In Progress</h3>
        <strong id="progressCount">0</strong>
      </div>
      <div class="stat">
        <h3>Completed</h3>
        <strong id="completedCount">0</strong>
      </div>
    </div>

    <div class="panel">
      <h2>Customer Enquiries</h2>
      <button id="refreshBtn">Refresh Enquiries</button>
      <p id="dashboardMessage" class="muted"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Service</th>
              <th>Message</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="enquiriesBody"></tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<script type="module">
  import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://czmfvupgvnesxfdfkdpn.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ucfnkThwRDIVKJMBza5FMA_MZ39KzR4";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginSection = document.getElementById("loginSection");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const dashboardMessage = document.getElementById("dashboardMessage");
  const enquiriesBody = document.getElementById("enquiriesBody");
  const logoutBtn = document.getElementById("logoutBtn");

  function showDashboard(loggedIn) {
    loginSection.classList.toggle("hidden", loggedIn);
    dashboard.classList.toggle("hidden", !loggedIn);
    logoutBtn.classList.toggle("hidden", !loggedIn);
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.textContent = "Logging in...";

    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent = "";
    showDashboard(true);
    loadEnquiries();
  });

  logoutBtn.addEventListener("click", async () => {
    await supabase.auth.signOut();
    showDashboard(false);
    loginForm.reset();
  });

  async function loadEnquiries() {
    dashboardMessage.textContent = "Loading enquiries...";
    enquiriesBody.replaceChildren();

    const { data, error } = await supabase
      .from("enquiries")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      dashboardMessage.textContent = "Error: " + error.message;
      return;
    }

    const rows = data || [];

    document.getElementById("newCount").textContent =
      rows.filter(x => x.status === "New").length;

    document.getElementById("progressCount").textContent =
      rows.filter(x => x.status === "In Progress").length;

    document.getElementById("completedCount").textContent =
      rows.filter(x => x.status === "Completed").length;

    if (rows.length === 0) {
      dashboardMessage.textContent = "No enquiries found yet.";
      return;
    }

    dashboardMessage.textContent = rows.length + " enquiries found.";

    rows.forEach((item) => {
      const tr = document.createElement("tr");

      const date = item.created_at
        ? new Date(item.created_at).toLocaleString()
        : "-";

      const values = [
        date,
        item.customer_name,
        item.phone,
        item.service_type,
        item.message || "-"
      ];

      values.forEach(value => {
        const td = document.createElement("td");
        td.textContent = value ?? "-";
        tr.appendChild(td);
      });

      const statusCell = document.createElement("td");
      const select = document.createElement("select");

      ["New", "In Progress", "Completed", "Cancelled"]
        .forEach(status => {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          select.appendChild(option);
        });

      select.value = item.status;
      select.addEventListener("change", async () => {
        select.disabled = true;
        dashboardMessage.textContent = "Updating enquiry...";

        const { error: updateError } = await supabase
          .from("enquiries")
          .update({ status: select.value })
          .eq("id", item.id);

        if (updateError) {
          alert("Update failed: " + updateError.message);
          select.value = item.status;
        } else {
          item.status = select.value;
        }

        select.disabled = false;
        loadEnquiries();
      });

      statusCell.appendChild(select);
      tr.appendChild(statusCell);
      enquiriesBody.appendChild(tr);
    });
  }

  document.getElementById("refreshBtn")
    .addEventListener("click", loadEnquiries);

  const { data: sessionData } = await supabase.auth.getSession();

  if (sessionData.session) {
    showDashboard(true);
    loadEnquiries();
  } else {
    showDashboard(false);
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    if (!session) showDashboard(false);
  });
</script>

</body>
</html>
