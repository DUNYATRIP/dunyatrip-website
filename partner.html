<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Partner | DunyaTrip</title><meta name="description" content="Apply for a DunyaTrip B2B travel partner account."><style>
:root{--green:#00A86B;--bright:#19C982;--light:#DDF8EA;--bg:#F5FAF7;--dark:#18352B;--muted:#64748B;--border:#E5EEE8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--dark)}a{color:inherit;text-decoration:none}.top{height:72px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 max(4%,calc((100% - 1120px)/2));justify-content:space-between}.logo{font-size:27px;font-weight:900;color:var(--dark)}.logo span{color:var(--green)}.wrap{max-width:900px;margin:38px auto;padding:0 18px}.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:clamp(22px,4vw,42px);box-shadow:0 12px 36px #18352b0c}.eyebrow{color:var(--green);font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:34px;margin:8px 0}p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{min-width:0}.field.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}input,select,textarea{width:100%;padding:13px;border:1px solid var(--border);border-radius:9px;background:white;font:inherit;color:var(--dark)}textarea{min-height:105px;resize:vertical}.multi{min-height:132px}.hint{font-size:12px;margin-top:5px}.btn{border:0;border-radius:10px;background:var(--green);color:white;padding:14px 22px;font-weight:800;font-size:15px;cursor:pointer}.btn:hover{background:#008653}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.status{font-size:13px;color:var(--green);min-height:20px}.back{color:var(--green);font-weight:700}@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{align-items:stretch;flex-direction:column}.actions .btn{width:100%}h1{font-size:28px}}
</style></head><body><header class="top"><a class="logo" href="index.html">Dunya<span>Trip</span>.</a><a class="back" href="sign-in.html">Sign In</a></header><main class="wrap"><section class="panel"><div class="eyebrow">DunyaTrip B2B</div><h1>Become a Partner</h1><p>Share your business details to request a DunyaTrip B2B account. You can skip any field and submit the form even if it is blank.</p><form id="partnerForm"><div class="grid">
<div class="field"><label for="business">Business / Agency Name</label><input id="business" placeholder="Your company name"></div>
<div class="field"><label for="businessType">Business Type (select multiple)</label><select id="businessType" class="multi" multiple><option>Travel Agency</option><option>Tour Operator</option><option>Freelancer / Independent Agent</option><option>Corporate Travel Desk</option><option>Other</option></select><div class="hint">Hold Ctrl (Windows) or Command (Mac) to select multiple.</div></div>
<div class="field"><label for="city">Office City</label><input id="city" placeholder="e.g. Rawalpindi"></div>
<div class="field"><label for="address">Office Address</label><input id="address" placeholder="Office address (optional)"></div>
<div class="field"><label for="name">Contact Person</label><input id="name" placeholder="Your full name"></div>
<div class="field"><label for="email">Business Email</label><input id="email" type="email" placeholder="name@company.com"></div>
<div class="field"><label for="phone">Mobile / WhatsApp</label><input id="phone" type="tel" placeholder="+92..."></div>
<div class="field"><label for="registered">Registered Business?</label><select id="registered"><option value="">Select (optional)</option><option>Yes</option><option>No</option><option>In process</option></select></div>
<div class="field full"><label for="services">Services Required (select multiple)</label><select id="services" class="multi" multiple><option>Flights</option><option>Hotels</option><option>Visa</option><option>Umrah</option><option>Tours</option><option>Cars</option><option>Insurance</option><option>Other</option></select><div class="hint">You can choose more than one, or leave this blank.</div></div>
<div class="field"><label for="website">Website / Social Media Link</label><input id="website" type="url" placeholder="https://"></div>
<div class="field"><label for="volume">Approx. Monthly Booking Volume</label><select id="volume"><option value="">Select (optional)</option><option>0–10</option><option>11–30</option><option>31–100</option><option>100+</option><option>Not sure</option></select></div>
<div class="field full"><label for="notes">Additional Information</label><textarea id="notes" placeholder="Anything else you'd like us to know?"></textarea></div>
</div><div class="actions"><div id="status" class="status" role="status" aria-live="polite"></div><button class="btn" id="submit" type="submit">Submit Partner Request →</button></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const cfg=window.DUNYATRIP_SUPABASE_CONFIG||{};const client=window.supabase&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey):null;
const val=id=>document.getElementById(id).value.trim();const multi=id=>Array.from(document.getElementById(id).selectedOptions).map(o=>o.value);
document.getElementById("partnerForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submit"),status=document.getElementById("status");btn.disabled=true;btn.textContent="Submitting…";status.textContent="";
const details={business_name:val("business"),business_type:multi("businessType"),office_city:val("city"),office_address:val("address"),contact_person:val("name"),email:val("email"),phone:val("phone"),registered_business:val("registered"),services:multi("services"),website:val("website"),monthly_booking_volume:val("volume"),additional_information:val("notes")};
const filled=Object.entries(details).filter(([,v])=>Array.isArray(v)?v.length:v!=="").map(([k,v])=>k.replaceAll("_"," ")+": "+(Array.isArray(v)?v.join(", "):v));
try{if(!client)throw new Error("Request form is not connected. Please contact DunyaTrip on WhatsApp.");const {error}=await client.from("enquiries").insert({customer_name:details.contact_person||null,phone:details.phone||null,service_type:"B2B",message:"B2B PARTNER APPLICATION\n"+(filled.length?filled.join("\n"):"Application submitted with no details.")});if(error)throw error;status.textContent="Your partner request has been received. Our team will review it.";document.getElementById("partnerForm").reset();}catch(err){status.textContent=err.message||"Could not submit your request. Please try again.";status.style.color="#b42318";}finally{btn.disabled=false;btn.textContent="Submit Partner Request →";}});
</script></body></html>
